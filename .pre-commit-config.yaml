exclude: 'alembic/|devops/|frontend/|scripts/|allure-results'
default_stages: [ commit ]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        description: 'Удаляет пробелы в конце строк'
      - id: end-of-file-fixer
        description: 'Добавляет пустую строку в конец файла'
      - id: check-yaml
        description: 'Проверяет синтаксис YAML файлов'

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        description: 'Форматирует Python код'

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        description: 'Проверяет код на соответствие PEP 8'
        additional_dependencies: [flake8-bugbear]
