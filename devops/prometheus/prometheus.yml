# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "app"

rule_files:

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets: ["192.168.0.194:9090"]

  - job_name: "cism-app"
    scrape_interval: 15s
    static_configs:
      - targets: ["{app ip}:{app port}"]
        labels:
          role: 'cism-app'
