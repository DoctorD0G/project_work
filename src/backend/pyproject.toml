[tool.poetry]
name = "Task Manager"
version = "0.1.0"
description = "Task Manager project work"
authors = ["Черников Антон Олегович antonchernik888@yandex.ru"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.111.1"
alembic = "1.13.2"
pydantic = "2.8.2"
celery = "5.4.0"
asyncpg = "0.29.0"
SQLAlchemy = { extras = ["asyncio"], version = "2.0.31" }
sentry-sdk = "2.11.0"
python-dotenv = "1.0.1"
uvicorn = "0.30.3"
jinja2 = "3.1.4"
fastapi-pagination = "0.12.26"
passlib = "1.7.4"
bcrypt = "4.2.0"
motor = "3.4.0"
pymongo = "4.8.0"
redis = "5.0.7"
lagom = "2.6.0"
dependency-injector = "4.41.0"
prometheus-fastapi-instrumentator = "7.0.0"
tzdata = "2024.1"
pyjwt = "2.8.0"
pydantic-settings = "2.3.4"
async-timeout = "4.0.3"
cism-fastapi-user = "1.0.1"
cism-fastapi-user-keycloak = "1.0.1"
pydantic-core = "2.20.1"
annotated-types = "0.7.0"
cism-python-utils = "^1.0.0"
cryptography = "40.0.2"

[tool.poetry.group.prod.dependencies]

[tool.poetry.group.dev.dependencies]
pre-commit = "3.8.0"
pytest = "7.2.1"
pytest-asyncio = "0.21.0"
pytest-dotenv = "0.5.2"
allure-pytest = "2.13.2"
httpx = "0.24.1"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry.source]]
name = "cism-ms"
url = "https://pypi-server.cism-ms.ru"
priority="primary"


[[tool.poetry.source]]
name = "PyPI"
priority="primary"
